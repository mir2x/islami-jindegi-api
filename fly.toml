app = 'islami-jindegi-dotnet-api'
# 'sin', not 'bom': the database was recreated in sin (bom was over the org's
# memory quota), so staying in bom put every query across a ~60-90ms
# cross-region hop — and EF's AsSplitQuery pays that several times per
# request. Keep the API in the same region as the database.
primary_region = 'sin'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0

  # Without a check Fly has no way to tell a wedged process from a healthy one,
  # so a starved instance stays "started" and keeps black-holing traffic.
  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

# Back on shared CPU as of 2026-09-02, after the cross-region hop was removed.
# The earlier shared-cpu-2x collapse (load 14, 90% CPU pressure stall, /health
# taking 19s) happened while the API sat in 'bom' and the database in 'sin':
# every request paid several 60-90ms round trips, so requests piled up and it
# was the *concurrency* that pinned the CPU, not serialisation alone. With both
# in 'sin' and twice the cores, /health, /api/categories and the paged list
# endpoints all return in 0.22-0.30s end-to-end from Bangladesh -- the same as
# on performance-2x, of which ~0.18s is network and TLS.
#
# Memory is 2gb, not 4gb: only ~1.1gb is used, and the spare 2gb was costing
# ~$11/month for nothing (the old note weighed it against Fly's regional memory
# quota, which is not the same thing as the bill).
#
# The /health check below is the tripwire: if shared cores ever stop coping,
# it goes unhealthy long before users notice. Escalation path is
# performance-1x, then performance-2x.
[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 4